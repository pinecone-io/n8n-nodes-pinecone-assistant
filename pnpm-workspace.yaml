# Install-time build-script policy. pnpm v10+ blocks dependency build
# scripts by default and fails CI with ERR_PNPM_IGNORED_BUILDS until each
# package with a build script is explicitly allowed (true) or denied (false).
# Both are dev-only: unrs-resolver ships a native (napi) binary its
# postinstall places (needed for eslint import resolution);
# eslint-plugin-n8n-nodes-base is lint tooling. See https://pnpm.io/settings
allowBuilds:
  eslint-plugin-n8n-nodes-base: true
  unrs-resolver: true
# Dependency overrides for security remediation.
# pnpm v10+ no longer reads the `pnpm.overrides` field in package.json;
# overrides must live here. See https://pnpm.io/settings
overrides:
  # Pre-existing override, migrated from package.json `pnpm.overrides`.
  minimatch@9: 10.2.3
  # Dependabot critical/high remediation (all dev/peer transitives).
  axios: '1.16.0' # GHSA (DoS / SSRF fixes) — clears <1.16.0
  handlebars: '4.7.9' # prototype pollution (critical) — >4.7.8
  ws: '8.21.0' # DoS — >=8.21.0
  undici: '6.27.0' # clears <6.27.0 (stays on the v6 line)
  tmp: '0.2.6' # arbitrary file write via symlink — >=0.2.6
  lodash: '4.18.1' # ReDoS — >4.17.23 (4.18.0 is a deprecated bad release; 4.18.1 fixes it)
  langsmith: '0.6.0' # >=0.6.0
  form-data: '4.0.6' # unsafe random boundary — >=4.0.6
  flatted: '3.4.2' # >3.4.1
